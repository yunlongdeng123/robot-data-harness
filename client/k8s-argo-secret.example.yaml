# robot-dh v1.5 Argo Workflows Secret 模板。
#
# - 用于在 kind / K8s 集群中给 Argo workflow pod / robot-data-harness step 注入连接信息。
# - 不要把真实密码提交到 git。生产用法：
#     1) 在云端执行 ./scripts/31_argowf_remote_env_export.sh --show-secrets
#        生成 client/robot-dh-v1-5.env
#     2) 用 client/k8s-create-argo-secret.example.sh 把变量同步到 K8s Secret
# - kind / Argo Pod 必须直连云端公网 IP/DNS，不能使用 WSL host 上的 127.0.0.1 SSH tunnel。
#   tunnel 仅适用于 WSL host 本身的客户端进程，而非 Pod 内部。
# - 建议把 namespace 与 ServiceAccount 拆开管理；本仓库提供的 ServiceAccount/RBAC 仅做模板，
#   实际 RBAC（argo-server / workflow-controller）由 WSL/kind 项目部署。
apiVersion: v1
kind: Namespace
metadata:
  name: robot-dh
  labels:
    app.kubernetes.io/part-of: robot-dh
    app.kubernetes.io/version: v1.5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: robot-dh-argo
  namespace: robot-dh
  labels:
    app.kubernetes.io/part-of: robot-dh
    app.kubernetes.io/version: v1.5
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: robot-dh-argo-workflow
  namespace: robot-dh
  labels:
    app.kubernetes.io/part-of: robot-dh
    app.kubernetes.io/version: v1.5
rules:
  # robot-data-harness step 需要读取 Secret / ConfigMap，写入 Pod / WorkflowTaskResult
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["argoproj.io"]
    resources:
      - workflows
      - workflowtaskresults
      - workflowtasksets
      - workflowartifactgctasks
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: robot-dh-argo-workflow
  namespace: robot-dh
  labels:
    app.kubernetes.io/part-of: robot-dh
    app.kubernetes.io/version: v1.5
subjects:
  - kind: ServiceAccount
    name: robot-dh-argo
    namespace: robot-dh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: robot-dh-argo-workflow
---
apiVersion: v1
kind: Secret
metadata:
  name: robot-dh-v1-5-secrets
  namespace: robot-dh
  labels:
    app.kubernetes.io/part-of: robot-dh
    app.kubernetes.io/version: v1.5
type: Opaque
stringData:
  ROBOT_DH_DB_URI: postgresql+psycopg://robot_dh_app:CHANGE_ME_APP_PASSWORD@PUBLIC_SERVER_IP_OR_DNS:5432/robot_dh
  ROBOT_DH_ARTIFACT_STORE: s3
  ROBOT_DH_S3_ENDPOINT_URL: http://PUBLIC_SERVER_IP_OR_DNS:9000
  ROBOT_DH_S3_ACCESS_KEY: robotdhapp
  ROBOT_DH_S3_SECRET_KEY: CHANGE_ME_MINIO_APP_SECRET
  ROBOT_DH_S3_DATA_BUCKET: robot-datasets
  ROBOT_DH_S3_ARTIFACT_BUCKET: robot-dh-artifacts
  ROBOT_DH_S3_LAKE_BUCKET: robot-lake
  ROBOT_DH_REDIS_URL: redis://:CHANGE_ME_REDIS_PASSWORD@PUBLIC_SERVER_IP_OR_DNS:6379/0
