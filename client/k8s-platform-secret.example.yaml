# robot-dh 平台 Secret 模板（v1.9 AI Inference Data Plane Lite）。
#
# 说明：
#   - Secret 名沿用 robot-dh-v1-6-secrets（Argo WorkflowTemplate 的 secretRef 已引用此名，
#     属于既有部署契约，不重命名；平台版本由 ROBOT_DH_PLATFORM_VERSION 标识为 1.9）。
#   - v1.9 在 v1.6 基础上新增 5 个 key：推理 / 蒸馏输出根、默认推理后端、
#     OpenAI-compatible base_url / api_key（mock / local_cpu 后端可留空）。
#
# 推荐流程：
#   1) 云端 ./scripts/49_export_inference_client_env.sh --show-secrets
#      生成 client/robot-dh-platform.env
#   2) scp 到 WSL，set -a; source client/robot-dh-platform.env; set +a
#   3) ./client/k8s-create-platform-secret.example.sh
#
# 不要把真实密码提交到 git。本仓库提供的 ServiceAccount / RBAC 仅做模板，
# 实际由 WSL/kind 项目部署 Argo 时绑定。
apiVersion: v1
kind: Namespace
metadata:
  name: robot-dh
  labels:
    app.kubernetes.io/part-of: robot-dh
    app.kubernetes.io/version: v1.6
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: robot-dh-argo
  namespace: robot-dh
  labels:
    app.kubernetes.io/part-of: robot-dh
    app.kubernetes.io/version: v1.6
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: robot-dh-argo-workflow
  namespace: robot-dh
  labels:
    app.kubernetes.io/part-of: robot-dh
    app.kubernetes.io/version: v1.6
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["argoproj.io"]
    resources:
      - workflows
      - workflowtaskresults
      - workflowtasksets
      - workflowartifactgctasks
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: robot-dh-argo-workflow
  namespace: robot-dh
  labels:
    app.kubernetes.io/part-of: robot-dh
    app.kubernetes.io/version: v1.6
subjects:
  - kind: ServiceAccount
    name: robot-dh-argo
    namespace: robot-dh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: robot-dh-argo-workflow
---
apiVersion: v1
kind: Secret
metadata:
  name: robot-dh-v1-6-secrets
  namespace: robot-dh
  labels:
    app.kubernetes.io/part-of: robot-dh
    app.kubernetes.io/version: v1.6
type: Opaque
stringData:
  ROBOT_DH_PLATFORM_VERSION: "1.9"
  ROBOT_DH_DB_URI: postgresql+psycopg://robot_dh_app:CHANGE_ME_APP_PASSWORD@PUBLIC_SERVER_IP_OR_DNS:5432/robot_dh
  ROBOT_DH_ARTIFACT_STORE: s3
  ROBOT_DH_S3_ENDPOINT_URL: http://PUBLIC_SERVER_IP_OR_DNS:9000
  ROBOT_DH_S3_REGION: us-east-1
  ROBOT_DH_S3_ACCESS_KEY: robotdhapp
  ROBOT_DH_S3_SECRET_KEY: CHANGE_ME_MINIO_APP_SECRET
  ROBOT_DH_S3_DATA_BUCKET: robot-datasets
  ROBOT_DH_S3_ARTIFACT_BUCKET: robot-dh-artifacts
  ROBOT_DH_S3_LAKE_BUCKET: robot-lake
  ROBOT_DH_REDIS_URL: redis://:CHANGE_ME_REDIS_PASSWORD@PUBLIC_SERVER_IP_OR_DNS:6379/0
  ROBOT_DH_QC_CONTRACT_BUCKET_PREFIX: s3://robot-lake/qc
  ROBOT_DH_ML_READY_ROOT: s3://robot-lake/ml-ready
  ROBOT_DH_WORKFLOW_TMP_PREFIX: s3://robot-lake/tmp/workflows
  ROBOT_DH_INFER_OUTPUT_ROOT: s3://robot-lake/infer
  ROBOT_DH_DISTILL_OUTPUT_ROOT: s3://robot-lake/distill
  ROBOT_DH_DEFAULT_INFER_BACKEND: mock
  # 下面两项仅 openai_compatible 后端需要；mock / local_cpu / autodl_worker 留空即可。
  ROBOT_DH_OPENAI_COMPATIBLE_BASE_URL: ""
  ROBOT_DH_OPENAI_COMPATIBLE_API_KEY: ""
