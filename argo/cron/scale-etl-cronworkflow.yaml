apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: robot-dh-scale-etl-cron
  namespace: robot-dh
  labels:
    app: robot-dh
    component: v1-5-argo
    role: scale-etl-cron
spec:
  schedule: "0 */12 * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  workflowSpec:
    workflowTemplateRef:
      name: robot-dh-scale-etl
    arguments:
      parameters:
        - name: root_uri
          value: "s3://robot-datasets/raw"
        - name: lake_root
          value: "s3://robot-lake"
        - name: include_pattern
          value: "*scale30*"
        - name: exclude_pattern
          value: "*bridgedata_v2_scale30*"
        - name: target_shard_size_gb
          value: "5"
        - name: max_workers
          value: "2"
        - name: max_shards
          value: "3"
