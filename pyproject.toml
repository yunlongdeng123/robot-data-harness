[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-data-harness"
version = "0.1.6"
description = "面向 Kubernetes 的机器人数据质量与评测框架（Robot Data Harness），覆盖数据湖、Scale ETL、多源 QC contract、ML-ready 导出、Argo 多源 DAG 与 Prometheus exporter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3==1.34.106",
  "botocore==1.34.106",
  "duckdb>=1.0,<2",
  "fastapi>=0.115,<1",
  "fsspec==2024.6.0",
  "h5py>=3.10,<4",
  "jinja2>=3.1,<4",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<4.13",
  "pandas>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "psutil>=5.9,<8",
  "pyarrow>=15,<22",
  "PyYAML>=6.0,<7",
  "redis>=5,<7",
  "aiobotocore==2.13.0",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "s3fs==2024.6.0",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[project.scripts]
robot-dh = "robot_dh.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"robot_dh.reports" = ["templates/*.j2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
