# v1.4 数据湖 Secret 示例。
#
# 警告：本文件仅作为占位示例，不要直接 kubectl apply。
# 请通过 scripts/k8s_create_lake_secret_from_env.sh 从已加载的 shell 环境变量
# (例如 source client/robot-dh-lake.env) 安全地写入真实 Secret。
#
# kind / K8s Pod 不能复用 WSL CLI 的 127.0.0.1 SSH tunnel：
#   - WSL CLI 通过 ssh -L 127.0.0.1:5432:db:5432 user@bastion 建立 tunnel，
#     仅在 WSL 本机 loopback 上监听。
#   - kind 节点是一个独立的容器，Pod 网络无法到达 WSL 的 127.0.0.1。
#   - 因此 Pod 必须直连云上服务的内网/公网地址，并由对端安全组放行 kind 出口。
#
# 真实 secret 请通过 envsubst / kubectl create secret 在本机生成，禁止提交到 git。
apiVersion: v1
kind: Secret
metadata:
  name: robot-dh-lake-secrets
  namespace: robot-dh
type: Opaque
stringData:
  ROBOT_DH_DB_URI: postgresql+psycopg://robot_dh_app:CHANGE_ME@db.example.com:5432/robot_dh
  ROBOT_DH_ARTIFACT_STORE: s3
  ROBOT_DH_S3_ENDPOINT_URL: http://minio.example.com:9000
  ROBOT_DH_S3_ACCESS_KEY: CHANGE_ME
  ROBOT_DH_S3_SECRET_KEY: CHANGE_ME
  ROBOT_DH_S3_DATA_BUCKET: robot-datasets
  ROBOT_DH_S3_ARTIFACT_BUCKET: robot-dh-artifacts
  ROBOT_DH_S3_LAKE_BUCKET: robot-lake
  ROBOT_DH_S3_REGION: us-east-1
  ROBOT_DH_REDIS_URL: redis://:CHANGE_ME@redis.example.com:6379/0
