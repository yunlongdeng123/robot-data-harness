apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: robot-dh-data-pvc
  namespace: robot-dh
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: robot-dh-artifacts-pvc
  namespace: robot-dh
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
