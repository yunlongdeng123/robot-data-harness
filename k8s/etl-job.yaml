apiVersion: batch/v1
kind: Job
metadata:
  name: robot-dh-etl
  namespace: robot-dh
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: etl
          image: robot-data-harness:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: robot-dh-remote-env
                optional: true
          env:
            - name: ROBOT_DH_LAKE_ROOT
              value: s3://robot-lake
            - name: ROBOT_DH_DATA_ROOT
              value: s3://robot-datasets
            - name: ROBOT_DH_ETL_LIMIT
              value: "3"
          command: ["/bin/sh", "-c"]
          args:
            - |
              : "${ROBOT_DH_DB_URI:?ROBOT_DH_DB_URI is required for remote ETL metadata}"
              : "${ROBOT_DH_S3_ENDPOINT_URL:?ROBOT_DH_S3_ENDPOINT_URL is required}"
              : "${ROBOT_DH_S3_ACCESS_KEY:?ROBOT_DH_S3_ACCESS_KEY is required}"
              : "${ROBOT_DH_S3_SECRET_KEY:?ROBOT_DH_S3_SECRET_KEY is required}"
              exec robot-dh etl scan \
                --root "${ROBOT_DH_DATA_ROOT}" \
                --lake-root "${ROBOT_DH_LAKE_ROOT}" \
                --limit "${ROBOT_DH_ETL_LIMIT}"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
