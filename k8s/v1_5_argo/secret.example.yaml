# 示例 Secret，**禁止**直接 apply 到真实集群。
# 推荐流程：
#   1) source client/robot-dh-v1-5.env
#   2) ./scripts/k8s_create_v1_5_secret_from_env.sh
# 该脚本会用 envsubst + kubectl apply 把真实凭据写入 robot-dh/robot-dh-v1-5-secrets。
#
# 注意：kind Pod 内 *不能* 使用 WSL 的 127.0.0.1 SSH tunnel；
# 必须使用云服务器公网 IP / DNS 或 Pod 网络可直连地址。
apiVersion: v1
kind: Secret
metadata:
  name: robot-dh-v1-5-secrets
  namespace: robot-dh
  labels:
    app: robot-dh
    component: v1-5-argo
type: Opaque
stringData:
  ROBOT_DH_DB_URI: "postgresql+psycopg://CHANGE_ME:CHANGE_ME@<pg-host>:5432/robot_dh"
  ROBOT_DH_EXPORTER_DB_URI: "postgresql://CHANGE_ME:CHANGE_ME@<pg-host>:5432/robot_dh"
  ROBOT_DH_ARTIFACT_STORE: "s3"
  ROBOT_DH_S3_ENDPOINT_URL: "https://<minio-host>:9000"
  ROBOT_DH_S3_ACCESS_KEY: "CHANGE_ME"
  ROBOT_DH_S3_SECRET_KEY: "CHANGE_ME"
  ROBOT_DH_S3_DATA_BUCKET: "robot-datasets"
  ROBOT_DH_S3_ARTIFACT_BUCKET: "robot-dh-artifacts"
  ROBOT_DH_S3_LAKE_BUCKET: "robot-lake"
  ROBOT_DH_REDIS_URL: "redis://<redis-host>:6379/0"
