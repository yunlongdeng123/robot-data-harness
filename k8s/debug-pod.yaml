apiVersion: v1
kind: Pod
metadata:
  name: robot-dh-debug
  namespace: robot-dh
spec:
  containers:
    - name: debug
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600000"]
      volumeMounts:
        - name: data
          mountPath: /data
        - name: artifacts
          mountPath: /artifacts
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: robot-dh-data-pvc
    - name: artifacts
      persistentVolumeClaim:
        claimName: robot-dh-artifacts-pvc
