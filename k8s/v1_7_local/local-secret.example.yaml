# v1.7 Local-First Data Runtime - secret 模板（仅示例）
#
# **绝不要**直接 apply 该文件到生产 cluster；
# 建议复用 robot-dh-v1-6-secrets：
#   1) source client/robot-dh-v1-6.env
#   2) ./scripts/k8s_create_platform_secret_from_env.sh
#
# 本模板列举 v1.7 本地 dev 场景**额外**需要的非敏感字段。
# 若在没有任何远端凭据的纯本地 demo 中跑（CLI 走 file://），可只用 ConfigMap，
# 不需要这个 Secret。
#
# 命名空间：robot-dh
# Secret 名：robot-dh-v1-7-local-secrets（与 v1.6 secret 区分）

apiVersion: v1
kind: Secret
metadata:
  name: robot-dh-v1-7-local-secrets
  namespace: robot-dh
  labels:
    app: robot-dh
    component: local-data-runtime
type: Opaque
stringData:
  # 如果本地 dev workflow 仍需要写 PG（写 task_heartbeats / workflow_runs 等），
  # 这里填 dev / staging PG，不要写生产 DSN。
  ROBOT_DH_DB_URI: "postgresql+psycopg://CHANGE_ME:CHANGE_ME@<dev-pg-host>:5432/robot_dh_dev"
  # 如果 dev workflow 还要写 lake（s3:// 路径），保留远端 MinIO 凭据。
  # 通常 v1.7 dev 不写远端，留空即可。
  ROBOT_DH_S3_ENDPOINT_URL: ""
  ROBOT_DH_S3_ACCESS_KEY: ""
  ROBOT_DH_S3_SECRET_KEY: ""
