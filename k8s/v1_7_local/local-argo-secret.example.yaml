# v1.7 Local Argo Secret 示例（仅模板，不要 kubectl apply 这份文件）。
#
# devscale workflow 默认**不需要任何 secret**：raw 数据走本地 PVC，lake 也写本地 PVC，
# 不访问远端 PG / S3 / MinIO。如果你的 workflow 想顺便把 step 状态 sync 到云端 PG（
# 比如 `make argo-local-sync`），可以创建一个最小化的 secret，**仅**包含 PG URI：
#
# Step 1：复制并改名（不要让真实 secret 进 git）。
# Step 2：填入真实凭据。
# Step 3：kubectl -n robot-dh apply -f <你重命名后的文件>。
#
# 注意：真实 secret 路径建议放到 client/ 下（已被 .gitignore 覆盖），
# 例如 client/k8s-v1-7-local-secrets.yaml，使用完即 `shred -u` 删除。
#
# 字段说明：
#   ROBOT_DH_PG_URI       可选。仅当 archive logs index / argo sync 要写回 PG 时需要。
#                          推荐用 read-only 账号；devscale 流量很小，PG 可以是云端复用 v1.6。
#   ROBOT_DH_S3_ENDPOINT_URL / ROBOT_DH_S3_ACCESS_KEY / ROBOT_DH_S3_SECRET_KEY
#                          通常**不需要**。仅当你显式把 archive_root 设为 s3:// 时才需要。
apiVersion: v1
kind: Secret
metadata:
  name: robot-dh-local-secrets
  namespace: robot-dh
  labels:
    app: robot-dh
    component: v1-7-local
type: Opaque
stringData:
  # 例 (开发机本地 PG)：postgresql+psycopg2://robot_dh:dev@host.docker.internal:5432/robot_dh
  ROBOT_DH_PG_URI: "REPLACE_ME_OR_DELETE"
  # 仅在 archive_root=s3://... 时填，devscale 默认 file:// 不需要
  ROBOT_DH_S3_ENDPOINT_URL: ""
  ROBOT_DH_S3_ACCESS_KEY: ""
  ROBOT_DH_S3_SECRET_KEY: ""
